<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Личный кабинет Маши — M.J.School</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; background-color: #0d1117; font-family: Arial, sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; position: relative; overflow-x: hidden; }
        .bg-image-wrapper { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .bg-image-wrapper img { width: 100%; height: 100%; object-fit: cover; opacity: 0.65; filter: brightness(130%) contrast(130%); mix-blend-mode: multiply; }
        .content-box { width: 100%; max-width: 1600px; min-height: 100px; background-color: #ffffff; padding: 10px 80px; border: 6px solid #f9f9f9; border-radius: 20px; box-shadow: 0 16px 48px rgba(0,0,0,0.3); display: flex; flex-direction: column; justify-content: center; position: relative; z-index: 1; }
        h1 { margin: 3; min-height: 200px; text-align: left; line-height: 1.3; font-size: 70px; font-weight: 600; color: #2c3e50; }
        h1 span { display: inline-block; font-size: 90px; color: #0a47ff; }
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 50px; margin-top: 35px; }
        .dashboard-btn { display: block; padding: 16px 28px; background: linear-gradient(135deg, #5c8af6 0%, #4242c1 100%); color: #ffffff; text-decoration: none; font-weight: 700; font-family: 'Montserrat', sans-serif; font-size: 22px; line-height: 1.3; border-radius: 54px; box-shadow: 0 10px 24px rgba(92, 102, 246, 0.45); transition: all 0.3s ease; text-align: center; white-space: nowrap; }
        .dashboard-btn:hover { transform: translateY(-4px) scale(1.03); box-shadow: 0 14px 32px rgba(100, 92, 246, 0.55); }
        #support-btn { position: fixed; top: 25px; right: 25px; width: 56px; height: 56px; background-color: #2f52ed; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; cursor: pointer; z-index: 999999; border: none; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35); transition: transform 0.2s, background-color 0.2s; font-family: Arial, sans-serif; outline: none; margin: 0; padding: 0; }
        #support-btn:hover { transform: scale(1.15); background-color: #182afb; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); }
    </style>
</head>
<body>
    <div class="bg-image-wrapper"><img src="school-border.jpg" alt="Школьные контуры" /></div>
    <div class="content-box">
        <h1>Добро пожаловать, <span>Маша</span>!</h1>
        <div class="dashboard-grid">
            <a href="https://7pgtba60.ktalk.ru/iyintyl9axik" class="dashboard-btn" target="_blank">📹 Перейти к уроку</a>
            <a href="students/masha/hw.html" class="dashboard-btn" target="_blank">📘 Домашнее задание</a>
            <a href="students/masha/notes.html" class="dashboard-btn" target="_blank">📖 Конспекты</a>
            <a href="students/masha/schedule.html" class="dashboard-btn" target="_blank">📅 Расписание</a>
        </div>
    </div>
</body>
</html>

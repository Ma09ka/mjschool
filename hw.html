<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>ДЗ Маши — M.J.School</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0; padding: 0; background-color: #0d1117; font-family: Arial, sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; position: relative; overflow-x: hidden;
        }
        .bg-image-wrapper { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .bg-image-wrapper img { width: 100%; height: 100%; object-fit: cover; opacity: 0.65; filter: brightness(130%) contrast(130%); mix-blend-mode: multiply; }
        .content-box { width: 100%; max-width: 900px; background-color: #ffffff; padding: 60px 40px; border: 6px solid #f9f9f9; border-radius: 20px; box-shadow: 0 16px 48px rgba(0,0,0,0.3); display: flex; flex-direction: column; position: relative; z-index: 1; }
        h1 { margin: 0; text-align: center; line-height: 1.3; font-size: 38px; font-weight: 700; color: #2c3e50; }
        h1 span { color: #0a47ff; }
        .hw-section { margin-top: 30px; border: 1px solid #e1e4e8; border-radius: 16px; padding: 24px; background: #f8f9fa; }
        .hw-title { font-size: 22px; font-weight: 700; color: #2c3e50; margin: 0 0 12px 0; }
        .hw-comment { font-size: 16px; color: #555; line-height: 1.5; margin-bottom: 14px; }
        .hw-action { display: inline-block; padding: 12px 20px; background: linear-gradient(135deg, #5c8af6 0%, #4242c1 100%); color: white; text-decoration: none; font-weight: 600; font-family: 'Montserrat', sans-serif; border-radius: 50px; transition: transform 0.2s, box-shadow 0.2s; margin-right: 10px; margin-bottom: 10px; }
        .hw-action:hover { transform: translateY(-2px); box-shadow: 0 8px 16px rgba(92, 102, 246, 0.4); }
        .hw-image { max-width: 100%; height: auto; border-radius: 12px; margin-bottom: 15px; border: 1px solid #ddd; }
        .upload-section { margin-top: 15px; padding-top: 15px; border-top: 1px dashed #ccc; }
        .upload-btn { background: #2ecc71; }
        .upload-btn:hover { background: #27ae60; }
        #upload-status { margin-top: 10px; font-weight: 600; display: none; }
        #upload-status.success { color: #2ecc71; }
        #upload-status.error { color: #e74c3c; }
        #support-btn { position: fixed; top: 25px; right: 25px; width: 56px; height: 56px; background-color: #2f52ed; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; cursor: pointer; z-index: 999999; border: none; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35); transition: transform 0.2s, background-color 0.2s; font-family: Arial, sans-serif; outline: none; margin: 0; padding: 0; }
        #support-btn:hover { transform: scale(1.15); background-color: #182afb; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); }
    </style>
</head>
<body>
    <div class="bg-image-wrapper"><img src="../../school-border.jpg" alt="Школьные контуры" /></div>
    <div class="content-box">
        <h1>Моё домашнее задание<br><span>M.J.School</span></h1>

        <div class="hw-section">
            <div class="hw-title">📝 Тест с автопроверкой</div>
            <div class="hw-comment">Пройди тест. Система сама проверит твои ответы.</div>
            <a href="../../test-hw2.html" class="hw-action" target="_blank">🔗 Перейти к тесту</a>
        </div>

        <div class="hw-section">
            <div class="hw-title">📸 Задание с фото (загрузи ответ здесь)</div>
            <div class="hw-comment">
                Посмотри на картинку. Выполни задание в тетради, сфотографируй и загрузи фото прямо сюда.
            </div>
            <img src="hw_image.jpg" alt="Задание" class="hw-image" id="hw-image">
            
            <div class="upload-section">
                <form id="upload-form">
                    <input type="hidden" id="upload-phone" name="phone" value="+79994445566">
                    <input type="file" id="hw-photo" name="homework_photo" accept="image/*" required style="margin-bottom: 10px;">
                    <br>
                    <button type="submit" class="hw-action upload-btn">📤 Отправить фото учителю</button>
                </form>
                <div id="upload-status"></div>
            </div>
        </div>
    </div>

    <button id="support-btn" aria-label="Поддержка">?</button>
    
    <script>
        function closeChat() { document.getElementById('chat-overlay').classList.remove('active'); }
        document.addEventListener('DOMContentLoaded', () => {
            const supportBtn = document.getElementById('support-btn');
            const chatOverlay = document.getElementById('chat-overlay');
            if (supportBtn && chatOverlay) {
                supportBtn.addEventListener('click', () => chatOverlay.classList.add('active'));
            }
        });

        document.getElementById('upload-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const statusDiv = document.getElementById('upload-status');
            statusDiv.style.display = 'none';

            const fileInput = document.getElementById('hw-photo');
            if (!fileInput.files || fileInput.files.length === 0) {
                statusDiv.textContent = 'Пожалуйста, выбери фото.';
                statusDiv.className = 'error';
                statusDiv.style.display = 'block';
                return;
            }

            const formData = new FormData(document.getElementById('upload-form'));

            try {
                statusDiv.textContent = '⏳ Отправка...';
                statusDiv.style.display = 'block';

                const response = await fetch('/upload-hw', { method: 'POST', body: formData });
                const data = await response.json();

                if (data.success) {
                    statusDiv.textContent = '✅ ' + data.message;
                    statusDiv.className = 'success';
                    document.getElementById('upload-form').reset();
                } else {
                    statusDiv.textContent = '❌ Ошибка: ' + data.message;
                    statusDiv.className = 'error';
                }
            } catch (err) {
                statusDiv.textContent = '❌ Ошибка соединения. Попробуй ещё раз.';
                statusDiv.className = 'error';
            }
            statusDiv.style.display = 'block';
        });
    </script>
</body>
</html>

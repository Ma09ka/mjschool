<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Расписание — M.J.School</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; background-color: #0d1117; font-family: Arial, sans-serif; display: flex; flex-direction: column; justify-content: center; align-items: center; min-height: 100vh; position: relative; overflow-x: hidden; }
        .bg-image-wrapper { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 100%; height: 100%; pointer-events: none; z-index: 0; }
        .bg-image-wrapper img { width: 100%; height: 100%; object-fit: cover; opacity: 0.65; filter: brightness(130%) contrast(130%); mix-blend-mode: multiply; }
        .content-box { width: 100%; max-width: 900px; background-color: #ffffff; padding: 60px 40px; border: 6px solid #f9f9f9; border-radius: 20px; box-shadow: 0 16px 48px rgba(0,0,0,0.3); display: flex; flex-direction: column; position: relative; z-index: 1; }
        h1 { margin: 0; text-align: center; line-height: 1.3; font-size: 38px; font-weight: 700; color: #2c3e50; }
        h1 span { color: #0a47ff; }
        .schedule-content { margin-top: 30px; border: 1px solid #e1e4e8; border-radius: 16px; padding: 24px; background: #f8f9fa; }
        .schedule-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        .schedule-table td, .schedule-table th { padding: 14px 10px; border-bottom: 1px solid #e1e4e8; text-align: left; }
        .schedule-table tr:last-child td { border-bottom: none; }
        .schedule-table .day { font-weight: 700; color: #2c3e50; width: 40%; }
        .schedule-table .time { color: #555; }
        #support-btn { position: fixed; top: 25px; right: 25px; width: 56px; height: 56px; background-color: #2f52ed; color: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 30px; cursor: pointer; z-index: 999999; border: none; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35); transition: transform 0.2s, background-color 0.2s; font-family: Arial, sans-serif; outline: none; margin: 0; padding: 0; }
        #support-btn:hover { transform: scale(1.15); background-color: #182afb; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); }
    </style>
</head>
<body>
    <!-- Путь к картинке: ../school-border.jpg, потому что мы в папке schedules -->
    
    <div class="bg-image-wrapper"><img src="../../school-border.jpg" alt="Школьные контуры" /></div>
    <div class="content-box">
        <h1>Моё расписание<br><span>M.J.School</span></h1>
        <div class="schedule-content">
            <table class="schedule-table">
                <tr><td class="day">📅 Среда</td><td class="time">16:00 — 17:30</td></tr>
                <tr><td class="day">📅 Пятница</td><td class="time">18:00 — 19:30</td></tr>
            </table>
        </div>
    </div>
    <button id="support-btn" aria-label="Поддержка">?</button>
    <script>
        function closeChat() { document.getElementById('chat-overlay').classList.remove('active'); }
        document.addEventListener('DOMContentLoaded', () => {
            const supportBtn = document.getElementById('support-btn');
            const chatOverlay = document.getElementById('chat-overlay');
            if (supportBtn && chatOverlay) {
                supportBtn.addEventListener('click', () => chatOverlay.classList.add('active'));
            }
        });
    </script>
</body>
</html>
